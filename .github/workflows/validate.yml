name: Deep Validation

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deep validate Quran data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deep validation
        run: npm run ci

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: data/validation-report.json
          if-no-files-found: ignore
